<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba 3D - Coche con Ventanas</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

  <a-scene>

    <!-- Fondo -->
    <a-sky color="#222"></a-sky>

    <!-- Suelo -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="6"
      height="6"
      color="#555">
    </a-plane>

    <!-- Contenedor del objeto -->
    <a-entity id="modelo" position="0 0 -4">

      <!-- Carrocería -->
      <a-box
        position="0 0.3 0"
        width="0.8"
        height="0.3"
        depth="1.5"
        color="#ff0000">
      </a-box>

      <!-- Techo -->
      <a-box
        position="0 0.55 0"
        width="0.5"
        height="0.2"
        depth="0.8"
        color="#cc0000">
      </a-box>

      <!-- Ventanas -->
      <a-box position="0 0.55 0" width="0.48" height="0.18" depth="0.01" color="#3399ff"></a-box>
      <a-box position="0 0.55 -0.1" width="0.48" height="0.18" depth="0.01" color="#3399ff"></a-box>

      <!-- Ruedas -->
      <a-cylinder position="-0.35 0.1 0.55" radius="0.1" height="0.1" rotation="0 0 90" color="#333"></a-cylinder>
      <a-cylinder position="0.35 0.1 0.55" radius="0.1" height="0.1" rotation="0 0 90" color="#333"></a-cylinder>
      <a-cylinder position="-0.35 0.1 -0.55" radius="0.1" height="0.1" rotation="0 0 90" color="#333"></a-cylinder>
      <a-cylinder position="0.35 0.1 -0.55" radius="0.1" height="0.1" rotation="0 0 90" color="#333"></a-cylinder>

      <!-- Faros delanteros -->
      <a-sphere position="-0.2 0.35 0.76" radius="0.05" color="#ffff00"></a-sphere>
      <a-sphere position="0.2 0.35 0.76" radius="0.05" color="#ffff00"></a-sphere>

    </a-entity>

    <!-- Cámara -->
    <a-camera position="0 1.6 0"></a-camera>

  </a-scene>

</body>
</html>
